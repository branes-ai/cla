# Branes.AI CLA check: reusable workflow, called by .github/workflows/cla.yml in every
# Branes.AI code repository. One signature covers all repositories, as with Google's CLA.
#
# Uses no secrets. It reads the public, scrambled signer list (signers.txt on branch
# "signers" of this repository) and never checks out pull request code.
#   pull_request_target: checks every commit author; if anyone is not covered, comments
#                        with a personal signing link and fails the check.
#   issue_comment "recheck": re-runs the check for that pull request.
# Signatures are recorded centrally (cla-form.yml), which also re-runs failed checks.

name: CLA check (reusable)

on:
  workflow_call:
    secrets:
      # No longer used. Kept optional so existing callers that still pass it keep working.
      CLA_SIGNATURES_TOKEN:
        required: false

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Get the check scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: branes-ai/cla
          ref: main
          path: cla
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Re-run on "recheck"
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const c = context.payload.comment, i = context.payload.issue;
            if (!i.pull_request || c.body.trim().toLowerCase() !== 'recheck') return;
            const { rerunForPr } = require(`${process.env.GITHUB_WORKSPACE}/cla/.github/scripts/rerun.js`);
            await rerunForPr(github, context.repo.owner, context.repo.repo, i.number, core);

      - name: Get the signer list
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: branes-ai/cla
          ref: signers
          path: signers
          sparse-checkout: signers.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check commit authors
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const check = require(`${process.env.GITHUB_WORKSPACE}/cla/.github/scripts/check-pr.js`);
            await check({ github, context, core, signersFile: `${process.env.GITHUB_WORKSPACE}/signers/signers.txt` });
