# Records CLA signatures submitted through the signing page
# (https://branes-ai.github.io/cla/sign/). The page encrypts the contributor's details in
# their browser and opens an issue here containing only the encrypted block. This workflow
# decrypts it, stores the record in the private branes-ai/cla-signatures repository,
# refreshes the public scrambled signer list, re-runs failed CLA checks across the org,
# confirms to the signer, then moves the issue into the private cla-signatures repository
# so no encrypted copy stays public (GitHub does not let apps delete issues).
#
# All secrets live in the "cla-signing" environment, usable only from the main branch:
#   CLA_FORM_PRIVATE_KEY                  decrypts submissions
#   RECORDER_APP_ID, RECORDER_APP_KEY     GitHub App on cla + cla-signatures only
#   RECHECK_APP_ID, RECHECK_APP_KEY       GitHub App on all repositories, Actions only
# Never print decrypted details or usernames from the signature store: logs are public.

name: CLA signing page

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: cla-signatures-write
  cancel-in-progress: false

jobs:
  record:
    if: contains(github.event.issue.body, 'BRANES-CLA-ENCRYPTED-V1')
    runs-on: ubuntu-latest
    environment: cla-signing
    steps:
      - name: Recorder token
        id: rec-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RECORDER_APP_ID }}
          private-key: ${{ secrets.RECORDER_APP_KEY }}
          owner: branes-ai
          repositories: cla,cla-signatures

      - name: Get the scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          sparse-checkout: .github/scripts
          path: cla
          persist-credentials: false

      - name: Get the private signature store
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: branes-ai/cla-signatures
          token: ${{ steps.rec-token.outputs.token }}
          path: sigs

      - name: Decrypt and record
        id: rec
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER_LOGIN: ${{ github.event.issue.user.login }}
          ISSUE_USER_ID: ${{ github.event.issue.user.id }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          CLA_FORM_PRIVATE_KEY: ${{ secrets.CLA_FORM_PRIVATE_KEY }}
          SIG_DIR: ${{ github.workspace }}/sigs
        run: node cla/.github/scripts/process-cla-form.js

      - name: Save to cla-signatures
        if: steps.rec.outputs.result == 'ok' || steps.rec.outputs.result == 'updated'
        working-directory: sigs
        env:
          SIGNER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "branes-cla-recorder[bot]"
          git config user.email "branes-cla-recorder[bot]@users.noreply.github.com"
          git add signatures
          git diff --cached --quiet && exit 0
          git commit -q -m "$SIGNER signed ICLA v1 via signing page"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1

      - name: Get the public signer list
        if: steps.rec.outputs.result == 'ok'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: signers
          token: ${{ steps.rec-token.outputs.token }}
          path: signers

      - name: Refresh the public signer list
        id: pub
        if: steps.rec.outputs.result == 'ok'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ steps.rec-token.outputs.token }}
          script: |
            const publish = require(`${process.env.GITHUB_WORKSPACE}/cla/.github/scripts/publish-signers.js`);
            const changed = await publish({ github, core, sigDir: `${process.env.GITHUB_WORKSPACE}/sigs`, outFile: `${process.env.GITHUB_WORKSPACE}/signers/signers.txt` });
            core.setOutput('changed', changed ? 'yes' : 'no');

      - name: Publish the signer list
        if: steps.pub.outputs.changed == 'yes'
        working-directory: signers
        run: |
          git config user.name "branes-cla-recorder[bot]"
          git config user.email "branes-cla-recorder[bot]@users.noreply.github.com"
          git commit -qam "Update signer list"
          git push -q

      - name: Recheck token
        id: re-token
        if: steps.pub.outputs.changed == 'yes'
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RECHECK_APP_ID }}
          private-key: ${{ secrets.RECHECK_APP_KEY }}
          owner: branes-ai

      - name: Re-run failed CLA checks
        id: rerun
        if: steps.re-token.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ steps.re-token.outputs.token }}
          script: |
            const { rerunAllFailed } = require(`${process.env.GITHUB_WORKSPACE}/cla/.github/scripts/rerun.js`);
            await rerunAllFailed(github, 'branes-ai', core);

      - name: Confirm to the signer
        if: always() && steps.rec.outputs.result != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          RESULT: ${{ steps.rec.outputs.result }}
          MESSAGE: ${{ steps.rec.outputs.message }}
          CTYPE: ${{ steps.rec.outputs.contributor_type }}
          PR_URL: ${{ steps.rec.outputs.pull_request }}
          RERAN: ${{ steps.rerun.outcome }}
        with:
          script: |
            const { RESULT, MESSAGE, CTYPE, PR_URL, RERAN } = process.env;
            const who = '@' + context.payload.issue.user.login;
            let body;
            if (RESULT === 'ok' || RESULT === 'updated') {
              body = `${who} thank you: your acceptance of the Branes.AI Individual Contributor License Agreement (v1.0) is recorded and your details are stored privately. One signature covers every Branes.AI repository.\n\n`;
              body += RERAN === 'success'
                ? 'The CLA check on your open pull requests is re-running now and should turn green within a few minutes.'
                : `If the CLA check${PR_URL ? ' on ' + PR_URL : ''} is still red in a few minutes, comment \`recheck\` on the pull request.`;
              if (CTYPE === 'employer' || CTYPE === 'university') body += '\n\nBecause you contribute for an employer or university, your organization must also sign the [Corporate CLA](https://github.com/branes-ai/cla/blob/main/CCLA.md). Contact kishore.kondapi@branes.ai.';
            } else {
              body = `${who} your signature could not be recorded: ${MESSAGE}\n\nSigning page: https://branes-ai.github.io/cla/sign/`;
            }
            body += '\n\nFor your privacy this request is moved to private storage in a moment; this message is also in your GitHub notifications email.';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Move the request to private storage
        if: always() && steps.rec-token.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ steps.rec-token.outputs.token }}
          script: |
            await new Promise((r) => setTimeout(r, 20000)); // let the notification email go out
            const { moveToPrivate } = require(`${process.env.GITHUB_WORKSPACE}/cla/.github/scripts/hide-request.js`);
            await moveToPrivate(github, context.payload.issue.node_id);
            core.info('Request moved to private storage.');
